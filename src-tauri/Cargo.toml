[package]
name = "gachanote-app"
description = "GachaNote 桌面端 Tauri 外壳：命令、事件、窗口与组装"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gachanote_app_lib"
# 只编为 rlib；以后做 Tauri mobile 时再加 staticlib / cdylib

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
base64.workspace = true
gachanote-core.workspace = true
gachanote-formats.workspace = true
gachanote-games.workspace = true
gachanote-meta.workspace = true
gachanote-store.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-specta.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# 与 workspace 的 lints 相同，只是 unsafe_code 从 forbid 放宽为 deny：
# DPAPI 需要调用 Windows API，只在 secret.rs 的 Windows 实现里局部允许
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
