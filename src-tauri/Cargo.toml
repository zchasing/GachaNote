[package]
name = "gachanote-app"
description = "GachaNote 桌面端 Tauri 外壳：命令、事件、窗口与组装"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gachanote_app_lib"
# 只编为 rlib；以后做 Tauri mobile 时再加 staticlib / cdylib

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
gachanote-core.workspace = true
gachanote-formats.workspace = true
gachanote-games.workspace = true
gachanote-meta.workspace = true
gachanote-store.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-dialog = "2"
tauri-specta.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
