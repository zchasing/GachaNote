# cargo-deny 配置：漏洞、许可证、重复依赖、依赖来源
[graph]
all-features = true
# 目前只发布 Windows 桌面版；Linux 上 Tauri 依赖的 gtk-rs 系列不进入发布产物
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # paste 不再维护，但只是编译期宏，被 tauri 与 specta 直接依赖，等上游替换
  { id = "RUSTSEC-2024-0436", reason = "tauri / specta 的编译期依赖，无运行时风险" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
]

# 本仓库的 crate 不发布到 crates.io，不需要许可证字段
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
