# 发布：推送 v* 标签时构建 Windows NSIS 安装包并创建 Release 草稿；
# 手动触发时只构建安装包并作为 artifact 上传，用于测试。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 检查工程是否就绪
        id: ready
        shell: bash
        run: |
          if [ -f src-tauri/tauri.conf.json ] && [ -f ui/package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::src-tauri 或 ui 尚未创建，跳过构建"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: ./.github/actions/setup-rust
      - if: steps.ready.outputs.ok == 'true'
        uses: ./.github/actions/setup-node

      - name: 标签与应用版本一致
        if: steps.ready.outputs.ok == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 tauri.conf.json 版本 $app 不一致"
            exit 1
          fi

      - name: 构建并创建 Release 草稿
        if: steps.ready.outputs.ok == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名（v0.2 起启用），私钥只放在仓库 Secrets
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GachaNote ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: --bundles nsis

      - name: 仅构建（手动触发）
        if: steps.ready.outputs.ok == 'true' && !startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis

      - name: 上传安装包
        if: steps.ready.outputs.ok == 'true' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: gachanote-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
