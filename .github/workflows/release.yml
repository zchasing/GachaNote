# 发布：推送 v* 标签时构建 Windows NSIS 安装包并创建 Release 草稿；
# 手动触发时只构建安装包并作为 artifact 上传，用于测试。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 检查工程是否就绪
        id: ready
        shell: bash
        run: |
          if [ -f src-tauri/tauri.conf.json ] && [ -f ui/package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::src-tauri 或 ui 尚未创建，跳过构建"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: ./.github/actions/setup-rust
      - if: steps.ready.outputs.ok == 'true'
        uses: ./.github/actions/setup-node

      - name: 标签与应用版本一致
        if: steps.ready.outputs.ok == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 tauri.conf.json 版本 $app 不一致"
            exit 1
          fi

      - name: 构建并创建 Release 草稿
        if: steps.ready.outputs.ok == 'true' && startsWith(github.ref, 'refs/tags/v')
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名（v0.2 起启用），私钥只放在仓库 Secrets
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GachaNote ${{ github.ref_name }}
          releaseDraft: true
          # 正文在后面的步骤里替换为更新日志 + 校验值
          releaseBody: 正在生成更新日志……
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          tauriScript: pnpm -C ui tauri
          args: --bundles nsis

      - name: 仅构建（手动触发）
        if: steps.ready.outputs.ok == 'true' && !startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: pnpm -C ui tauri
          args: --bundles nsis

      # NFR-04：安装包 ≤ 20 MB；同时生成 SHA-256，发布页公开校验值（未签名安装包的补救）
      - name: 检查安装包体积并计算 SHA-256
        if: steps.ready.outputs.ok == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/bundle/nsis/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有找到 NSIS 安装包"
            exit 1
          fi
          limit=$((20 * 1024 * 1024))
          : > SHA256SUMS.txt
          for f in "${files[@]}"; do
            name=$(basename "$f")
            size=$(stat -c %s "$f")
            mb=$(awk -v s="$size" 'BEGIN { printf "%.1f", s / 1048576 }')
            echo "- $name：$mb MB" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$name 为 $mb MB，超过 20 MB"
              exit 1
            fi
            (cd "$(dirname "$f")" && sha256sum "$name") >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: 写入更新日志与校验值
        if: steps.ready.outputs.ok == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          # 更新日志由 GitHub 按上一个标签以来合并的 PR 生成（PR 标题即 Conventional Commits 提交信息）
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > notes.md
          guide="https://github.com/$GITHUB_REPOSITORY/blob/main/docs/user-guide.md"
          {
            cat notes.md
            echo
            echo "## 下载与安装"
            echo
            echo "下载 .exe 安装包，双击安装（装到当前用户，不需要管理员权限）。安装包没有代码签名，"
            echo "Windows SmartScreen 可能提示「Windows 已保护你的电脑」：点「更多信息」→「仍要运行」。"
            echo "详见[使用说明]($guide)。"
            echo
            echo "## SHA-256"
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } > body.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F body=@body.md > /dev/null
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber

      - name: 上传安装包
        if: steps.ready.outputs.ok == 'true' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: gachanote-windows-nsis
          path: |
            target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
