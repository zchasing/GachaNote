# PR 规范检查：标题与每条提交都要符合 Conventional Commits，并按改动路径自动打标签。
name: PR 规范

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: PR 标题
    runs-on: ubuntu-latest
    steps:
      # 采用 squash merge，PR 标题即最终提交信息
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: '描述不要以大写字母开头，例如 "feat(core): 新增保底状态机"'

  commits:
    name: 提交信息
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  labels:
    name: 自动标签
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # 来自 fork 的 PR 没有写权限，跳过即可
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
